<br><br><b>theta ** (...)</b> — 10000的这些幂次

let cur = 0;
function render() {
  const s = S[cur];
  document.getElementById('pos').textContent = `${cur+1} / ${S.length}`;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===S.length-1;
  document.querySelectorAll('.pills button').forEach((b,i)=>b.classList.toggle('on',i===cur));
  document.getElementById('card').innerHTML = `<h2>${s.t}</h2><div class="code"><pre>${s.code}</pre></div>${s.shape?`<div class="shape">${s.shape}</div>`:''}${s.purpose?`<div class="purpose">${s.purpose}</div>`:''}<div style="font-size:13px;color:#444;line-height:1.8">${s.viz}</div>${s.ex?`<div class="ex">${s.ex}</div>`:''}`;
}
function go(d){const n=cur+d;if(n>=0&&n<S.length){cur=n;render();document.getElementById('card').scrollIntoView({behavior:'smooth',block:'start'});}}
function to(i){cur=i;render();}
(function(){
  const p=document.getElementById('pills');
  S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i;b.title=s.t;b.onclick=()=>to(i);p.appendChild(b);});
  document.getElementById('prevBtn').onclick=()=>go(-1);
  document.getElementById('nextBtn').onclick=()=>go(1);
  render();
})();
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
</script>
